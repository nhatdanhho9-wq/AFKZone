server {
    listen 443 ssl;
    server_name api.afkzone.cloud;

    ssl_certificate /etc/letsencrypt/live/api.afkzone.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.afkzone.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limited admin login endpoint
    location = /admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:21120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API endpoints
    location / {
        proxy_pass http://127.0.0.1:21120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.afkzone.cloud;
    return 301 https://$host$request_uri;
}
