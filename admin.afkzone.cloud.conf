server {
    listen 443 ssl;
    server_name admin.afkzone.cloud;
    root /var/www/afkzone-admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/admin.afkzone.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.afkzone.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    server_name admin.afkzone.cloud;
    return 301 https://$host$request_uri;
}
