pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        // CRITICAL: Force osdetector-gradle-plugin (com.google.gradle) to resolve from Plugin Portal ONLY
        // This prevents Maven Central 403 errors that randomly occur
        exclusiveContent {
            forRepository {
                gradlePluginPortal()
            }
            filter {
                includeGroup "com.google.gradle"  // osdetector-gradle-plugin group
            }
        }
        google()
        mavenCentral()
        gradlePluginPortal()  // General plugin fallback
        // Fallback repositories for better reliability (CI 403 workaround)
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://repo1.maven.org/maven2' }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "7.3.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.21" apply false
}

include ":app"
